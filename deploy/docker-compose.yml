# Bangalore Collective on the VPS.
# Secrets live in .env next to this file on the server (never in git). See deploy/README.md.
#
# Only Caddy is reachable from the internet (ports 80 and 443). The database and PostgREST are
# bound to 127.0.0.1, so they are only reachable from the VPS itself or through an SSH tunnel.

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: bangalorecollective
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./import:/import:ro
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bangalorecollective"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v16.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/bangalorecollective
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set in .env}
      # Same row cap the site has on Supabase today, so pages behave the same.
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "10"
      # Lets a request ask for its changes to be rolled back (Prefer: tx=rollback).
      # Used by deploy/tests/check-access.sh; a client can only undo its own request.
      PGRST_DB_TX_END: commit-allow-override
    ports:
      - "127.0.0.1:3001:3000"

  app:
    # Built by build-app.sh (the build needs the database, which compose cannot give it).
    image: bangalorecollective-app
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - rest
    environment:
      DATABASE_URL: postgres://app_server:${APP_SERVER_PASSWORD:?set in .env}@db:5432/bangalorecollective
      POSTGREST_URL: http://rest:3000
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: https://${SITE_HOST:?set in .env}
      UPLOAD_DIR: /data/uploads
      IMAGE_CACHE_DIR: /data/image-cache
      # Anything but "send" writes emails to the log instead of sending them.
      MAIL_MODE: ${MAIL_MODE:-log}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    volumes:
      - ./uploads:/data/uploads
      - image-cache:/data/image-cache

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
      STAGING_USER: ${STAGING_USER:-preview}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?set in .env}
      TOOLS_HOST: ${TOOLS_HOST:?set in .env}
      TOOLS_USER: ${TOOLS_USER:-owner}
      TOOLS_PASSWORD_HASH: ${TOOLS_PASSWORD_HASH:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./uploads:/data/uploads:ro
      - caddy-data:/data/caddy
      - caddy-config:/config

  # Database viewer at /pgadmin, signed in as the read-only "viewer" role (sql/040_viewer_role.sql).
  # Only reachable through Caddy.
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SCRIPT_NAME: /pgadmin
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro

  # File viewer at /files for the uploaded images, videos and payment proofs. The uploads are
  # mounted read-only, so nothing can be changed or deleted from here.
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    restart: unless-stopped
    user: "1001:1001"
    entrypoint: ["filebrowser"]
    command: ["--database", "/database/filebrowser.db", "--root", "/srv", "--baseURL", "/files", "--address", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./uploads:/srv:ro
      - ./filebrowser:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/files/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  image-cache:
  caddy-data:
  caddy-config:
  pgadmin-data:
