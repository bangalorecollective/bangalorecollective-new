name: Build Bangalore Collective AAB

# Manual: GitHub → Actions → "Build Bangalore Collective AAB" → Run workflow. The signed APK and AAB
# are attached to the run. The app opens https://www.bangalorecollective.com (capacitor.config.ts),
# so website changes and the move to the VPS need no new build; only app changes (name, icon,
# version) do. Raise versionCode in android/app/build.gradle before a Play Store upload.
# Needs the secrets ANDROID_KEYSTORE_CONTENT, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # same as the Dockerfile; npm 10 rejects this lock file
          cache: 'npm'

      # Only the Capacitor CLI is needed: the app loads the live website, and its bundled files
      # (capacitor-www: offline page and logo) are already in the repo. No website build or keys.
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); android-actions/setup-android
      # failed there on licence prompts with cmdline-tools 16.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create Android Assets Directory
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Check Keystore Secret Integrity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_CONTENT }}
        run: |
          python3 -c "
          import os, sys
          s = os.environ.get('KEYSTORE_BASE64', '').strip()
          length = len(s)
          print(f'KEYSTORE_BASE64 length: {length}')
          if length == 0:
              print('::error::ANDROID_KEYSTORE_CONTENT secret is empty or not set.')
              sys.exit(1)
          if length % 4 != 0:
              print(f'::error::Base64 length {length} is not a multiple of 4 -- the secret is truncated or corrupted. Re-generate it with: base64 -w0 keystore.jks and re-upload with gh secret set, not by pasting into the web UI.')
              sys.exit(1)
          print('Length check passed.')
          "

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_CONTENT }}
        run: |
          python3 -c "import os, base64; open('android/bangalorecollective-release.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"

      - name: Create keystore.properties
        run: |
          echo "storeFile=bangalorecollective-release.jks" >> android/keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build Release AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bangalorecollective-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bangalorecollective-apk
          path: android/app/build/outputs/apk/release/app-release.apk