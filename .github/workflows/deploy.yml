name: Deploy to VPS

# Every push to main updates the site on the VPS, like Vercel. The code is type-checked first;
# if that fails, nothing on the server changes. See deploy/deploy-from-github.sh.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check the code
        run: npx tsc --noEmit -p .

      - name: Update the VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The VPS's own host key, so the job only ever talks to this server.
          echo "201.18.206.138 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBMU5ewXX/jgX+5XyIzthBokn43wbOV8zGDNvmKsBYzf" > ~/.ssh/known_hosts
          # The key can only run deploy-from-github.sh on the server.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@201.18.206.138
